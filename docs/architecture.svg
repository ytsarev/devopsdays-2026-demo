<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc">
  <title id="title">Let AI think. Let controllers reconcile.</title>
  <desc id="desc">One Cache object with three writers. You create it and approve remediation with a label. Two Crossplane WatchOperations watch it and run gate, think and fence steps: the model runs in Ollama on the laptop, and only the deterministic fence applies changes, the diagnosis annotation or the costCenter field. The composition looks up the cost center in a registry, writes status and composes a local Valkey.</desc>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <clipPath id="cache-clip"><rect x="470" y="190" width="300" height="288" rx="12"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .b { font-weight: 700; }
    .muted { fill: #64748b; }
    .value { fill: #475569; }
    .small { font-size: 11px; }
    .mid { text-anchor: middle; }
  </style>

  <rect x="0" y="0" width="1200" height="700" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- title -->
  <text x="40" y="50" font-size="24" class="b">Let AI think. Let controllers reconcile.</text>
  <text x="40" y="76" font-size="14" class="muted">One Cache, three writers. Everything runs on this laptop.</text>

  <!-- you -->
  <rect x="520" y="100" width="200" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="129" font-size="15" class="b mid" style="fill:#1e3a8a">You · kubectl</text>
  <line x1="620" y1="146" x2="620" y2="186" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="632" y="172" font-size="12" style="fill:#1d4ed8">create the Cache, approve with a label</text>

  <!-- the Cache -->
  <rect x="470" y="190" width="300" height="288" rx="12" fill="#ffffff"/>
  <g clip-path="url(#cache-clip)">
    <rect x="470" y="190" width="300" height="40" fill="#0f172a"/>
    <rect x="470" y="230" width="6" height="62" fill="#2563eb"/>
    <rect x="470" y="292" width="6" height="62" fill="#d97706"/>
    <rect x="470" y="354" width="6" height="31" fill="#2563eb"/>
    <rect x="470" y="385" width="6" height="31" fill="#d97706"/>
    <rect x="470" y="416" width="6" height="62" fill="#7c3aed"/>
  </g>
  <rect x="470" y="190" width="300" height="288" rx="12" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <text x="486" y="216" font-size="15" class="b" style="fill:#ffffff">Cache <tspan class="mono" font-size="13" font-weight="400" style="fill:#cbd5e1">demo-stuck</tspan></text>
  <line x1="470" y1="292" x2="770" y2="292" stroke="#e2e8f0"/>
  <line x1="470" y1="354" x2="770" y2="354" stroke="#e2e8f0"/>
  <line x1="470" y1="416" x2="770" y2="416" stroke="#e2e8f0"/>

  <text x="486" y="255" font-size="13" class="mono b">metadata.labels</text>
  <text x="486" y="276" font-size="12" class="mono value">allow-auto-remediation: "true"</text>
  <rect x="712" y="241" width="46" height="18" rx="9" fill="#dbeafe"/>
  <text x="735" y="254" class="small b mid" style="fill:#1d4ed8">you</text>

  <text x="486" y="317" font-size="13" class="mono b">metadata.annotations</text>
  <text x="486" y="338" font-size="12" class="mono value">diagnosis: "…most likely CC-4711"</text>
  <rect x="672" y="303" width="86" height="18" rx="9" fill="#fef3c7"/>
  <text x="715" y="316" class="small b mid" style="fill:#b45309">AI via fence</text>

  <text x="486" y="379" font-size="13" class="mono b">spec.parameters</text>
  <text x="486" y="400" font-size="12" class="mono value">costCenter: CC-4171 → CC-4711</text>
  <rect x="620" y="365" width="44" height="18" rx="9" fill="#dbeafe"/>
  <text x="642" y="378" class="small b mid" style="fill:#1d4ed8">you</text>
  <rect x="672" y="365" width="86" height="18" rx="9" fill="#fef3c7"/>
  <text x="715" y="378" class="small b mid" style="fill:#b45309">AI via fence</text>

  <text x="486" y="441" font-size="13" class="mono b">status</text>
  <text x="486" y="462" font-size="12" class="mono value">conditions · costCenter.known</text>
  <rect x="680" y="427" width="78" height="18" rx="9" fill="#ede9fe"/>
  <text x="719" y="440" class="small b mid" style="fill:#6d28d9">controller</text>

  <!-- AI controllers -->
  <rect x="30" y="205" width="390" height="275" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="46" y="228" font-size="11" class="b" style="fill:#475569;letter-spacing:0.06em">AI CONTROLLERS · CROSSPLANE WATCHOPERATIONS</text>

  <rect x="46" y="240" width="358" height="104" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="62" y="263" font-size="14" class="mono b">diagnose-caches</text>
  <text x="62" y="282" font-size="12" class="muted">watches every Cache · writes the diagnosis</text>
  <rect x="62" y="296" width="88" height="30" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text x="106" y="316" font-size="13" class="b mid" style="fill:#065f46">gate</text>
  <line x1="150" y1="311" x2="166" y2="311" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <rect x="168" y="296" width="88" height="30" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="212" y="316" font-size="13" class="b mid" style="fill:#92400e">think</text>
  <line x1="256" y1="311" x2="272" y2="311" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <rect x="274" y="296" width="112" height="30" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text x="330" y="316" font-size="13" class="b mid" style="fill:#065f46">fence</text>

  <rect x="46" y="360" width="358" height="104" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="62" y="383" font-size="14" class="mono b">remediate-caches</text>
  <text x="62" y="402" font-size="12" class="muted">watches approved Caches only · patches costCenter</text>
  <rect x="62" y="416" width="88" height="30" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text x="106" y="436" font-size="13" class="b mid" style="fill:#065f46">gate</text>
  <line x1="150" y1="431" x2="166" y2="431" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <rect x="168" y="416" width="88" height="30" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="212" y="436" font-size="13" class="b mid" style="fill:#92400e">think</text>
  <line x1="256" y1="431" x2="272" y2="431" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <rect x="274" y="416" width="112" height="30" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text x="330" y="436" font-size="13" class="b mid" style="fill:#065f46">fence</text>

  <!-- watch and apply, between the WatchOperations and the Cache -->
  <line x1="406" y1="316" x2="466" y2="316" stroke="#d97706" stroke-width="2" marker-end="url(#ah-amber)"/>
  <text x="436" y="309" class="small mid" style="fill:#b45309">applies</text>
  <line x1="468" y1="332" x2="410" y2="332" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah-gray)"/>
  <text x="438" y="347" class="small mid muted">watches</text>
  <line x1="406" y1="380" x2="466" y2="380" stroke="#d97706" stroke-width="2" marker-end="url(#ah-amber)"/>
  <text x="436" y="373" class="small mid" style="fill:#b45309">applies</text>
  <line x1="468" y1="396" x2="410" y2="396" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah-gray)"/>
  <text x="438" y="411" class="small mid muted">watches</text>

  <!-- local model -->
  <line x1="213" y1="482" x2="213" y2="552" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah-amber)"/>
  <text x="225" y="522" font-size="12" style="fill:#b45309">think steps call the local model</text>
  <rect x="103" y="556" width="220" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="213" y="582" font-size="14" class="b mid" style="fill:#78350f">Ollama · qwen3 30B-A3B</text>
  <text x="213" y="602" font-size="12" class="mid" style="fill:#92400e">on this Mac · 127.0.0.1 only</text>

  <!-- registry, composition, Valkey -->
  <rect x="830" y="215" width="330" height="78" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="846" y="239" font-size="13" class="b">CostCenter registry</text>
  <text x="846" y="260" font-size="12" class="mono value">CC-4711 payments · CC-5200 search</text>
  <text x="846" y="278" font-size="12" class="mono value">CC-6300 analytics</text>
  <line x1="995" y1="293" x2="995" y2="326" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <text x="1005" y="314" class="small muted">lookup</text>

  <rect x="830" y="330" width="330" height="120" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="846" y="354" font-size="14" class="b">Composition <tspan class="mono" font-size="13">cache</tspan></text>
  <text x="846" y="373" font-size="12" style="fill:#6d28d9">embedded Python function · the controller</text>
  <text x="846" y="398" font-size="12">cost center found → compose Valkey, Ready</text>
  <text x="846" y="418" font-size="12">not found → compose nothing, not Ready</text>
  <text x="846" y="438" font-size="12" class="muted">and say why: a condition and an event</text>

  <line x1="772" y1="372" x2="826" y2="372" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <text x="799" y="365" class="small mid muted">spec</text>
  <line x1="828" y1="440" x2="774" y2="440" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah-violet)"/>
  <text x="799" y="456" class="small mid" style="fill:#6d28d9">status</text>

  <line x1="995" y1="450" x2="995" y2="516" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah-violet)"/>
  <text x="1005" y="488" class="small" style="fill:#6d28d9">composes</text>
  <rect x="830" y="520" width="330" height="70" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="846" y="546" font-size="14" class="b">Valkey on kind</text>
  <text x="1144" y="546" font-size="12" class="mono b" text-anchor="end" style="fill:#059669">PONG</text>
  <text x="846" y="570" font-size="12" class="mono value">Deployment · Service · ConfigMap</text>

  <!-- legend -->
  <circle cx="46" cy="646" r="6" fill="#2563eb"/>
  <text x="58" y="650" font-size="12">you, with kubectl</text>
  <circle cx="210" cy="646" r="6" fill="#d97706"/>
  <text x="222" y="650" font-size="12">the model, only through the fence</text>
  <circle cx="470" cy="646" r="6" fill="#059669"/>
  <text x="482" y="650" font-size="12">deterministic code: gate, fence</text>
  <circle cx="720" cy="646" r="6" fill="#7c3aed"/>
  <text x="732" y="650" font-size="12">the Crossplane controller</text>
  <text x="40" y="680" font-size="12" class="muted">a Crossplane project: kind · Crossplane v2.4 · embedded Python functions · function-openai → local Ollama · no cloud, no internet during the demo</text>
</svg>
