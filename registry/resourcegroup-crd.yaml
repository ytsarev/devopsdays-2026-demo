# A tiny stand-in for cloud resource groups: a cluster-scoped registry.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: resourcegroups.registry.demo.example.org
spec:
  group: registry.demo.example.org
  names:
    kind: ResourceGroup
    listKind: ResourceGroupList
    plural: resourcegroups
    singular: resourcegroup
    shortNames: [rg]
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: ARD-ID
      type: string
      jsonPath: .spec.ardId
    - name: OWNER
      type: string
      jsonPath: .spec.owner
    - name: REGION
      type: string
      jsonPath: .spec.region
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [ardId, owner, region]
            properties:
              ardId:
                type: string
                pattern: '^ARD-[0-9]{3}$'
              owner:
                type: string
              region:
                type: string
