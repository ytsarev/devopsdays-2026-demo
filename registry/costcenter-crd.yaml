# A tiny stand-in for the finance system: a cluster-scoped registry of cost centers.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: costcenters.registry.demo.example.org
spec:
  group: registry.demo.example.org
  names:
    kind: CostCenter
    listKind: CostCenterList
    plural: costcenters
    singular: costcenter
    shortNames: [cc]
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: CODE
      type: string
      jsonPath: .spec.code
    - name: OWNER
      type: string
      jsonPath: .spec.owner
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [code, owner]
            properties:
              code:
                type: string
                pattern: '^CC-[0-9]{4}$'
              owner:
                type: string
