# Crossplane reads ResourceGroups as required resources (composition and
# operations) and watches them so a new group re-reconciles affected Caches.
# ConfigMaps, Deployments, Services, Events and the Cache XR itself are already
# covered by Crossplane's default ClusterRole and the RBAC manager.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane:read-resourcegroups
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
- apiGroups: [registry.demo.example.org]
  resources: [resourcegroups]
  verbs: [get, list, watch]
