# function-openai credentials. The name `gpt` and a non-empty OPENAI_API_KEY are
# required by the function; Ollama ignores the key.
apiVersion: v1
kind: Secret
metadata:
  name: gpt
  namespace: crossplane-system
stringData:
  OPENAI_API_KEY: local-only
  OPENAI_BASE_URL: http://ollama.llm.svc.cluster.local:11434/v1
  OPENAI_MODEL: cache-sre
