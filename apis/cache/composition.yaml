# Cache composition. The step runs the project's embedded Python function
# functions/compose-cache, which `crossplane project build` packages as
# devopsdays-democompose-cache (the CLI derives the name from spec.repository
# in crossplane-project.yaml).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: cache
spec:
  compositeTypeRef:
    apiVersion: cache.demo.example.org/v1alpha1
    kind: Cache
  mode: Pipeline
  pipeline:
  - step: compose-cache
    functionRef:
      name: devopsdays-democompose-cache
    requirements:
      requiredResources:
      - requirementName: cost-centers
        apiVersion: registry.demo.example.org/v1alpha1
        kind: CostCenter
