# The Cache API. Guardrail #1 lives here: the schema, not a prompt.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: caches.cache.demo.example.org
spec:
  group: cache.demo.example.org
  names:
    kind: Cache
    plural: caches
  scope: Namespaced
  defaultCompositionRef:
    name: cache
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    additionalPrinterColumns:
    - name: COST-CENTER
      type: string
      jsonPath: .spec.parameters.costCenter
    - name: SKU
      type: string
      jsonPath: .spec.parameters.sku
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [parameters]
            properties:
              parameters:
                type: object
                required: [application, costCenter, sku]
                properties:
                  application:
                    type: string
                    description: Application that owns this cache.
                  costCenter:
                    type: string
                    description: Cost center the cache is billed to. No valid cost center, no infrastructure.
                    pattern: '^CC-[0-9]{4}$'
                  sku:
                    type: string
                    enum: [xs, s, m, l, xl]
          status:
            type: object
            properties:
              endpoint:
                type: string
                description: In-cluster address of the cache.
              costCenter:
                type: object
                description: What the controller observed when resolving spec.parameters.costCenter.
                properties:
                  code:
                    type: string
                  found:
                    type: boolean
                  known:
                    type: array
                    description: Cost centers that exist in the registry.
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        owner:
                          type: string
