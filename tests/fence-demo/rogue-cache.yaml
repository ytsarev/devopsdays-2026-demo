# Target for `./demo.sh fence`: stuck, consented and diagnosed, in a namespace
# the WatchOperations do not watch, so only the canned proposals reach it.
apiVersion: v1
kind: Namespace
metadata:
  name: qa
---
apiVersion: cache.demo.example.org/v1alpha1
kind: Cache
metadata:
  name: demo-rogue
  namespace: qa
  labels:
    allow-auto-remediation: "true"
  annotations:
    cache.demo.example.org/diagnosis: "No cost center matches CC-4171; CC-4711 (owner payments) is the likely intent."
spec:
  parameters:
    application: payments-api
    costCenter: CC-4171
    sku: s
